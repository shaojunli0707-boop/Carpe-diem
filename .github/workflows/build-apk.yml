name: Build ShanJi Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Fix Icon & Assemble Debug APK
        run: |
          # 1. 自动同意 GitHub 自带 Android SDK 的所有协议（无需安装旧插件）
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # 2. 生成一个合规的 PNG 图标，覆盖掉原压缩包里格式错误的图标文件，防止编译崩溃
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          # 3. 开始打包编译 APK
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ./shanji-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shanji-android-apk
          path: ./shanji-debug.apk
